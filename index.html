<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Afterframe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: phone-shaped 9:16 stage on top, controls below; side by side on wide screens. */
:root{
  --bg:#0f1014; --panel:#181a20; --line:#2a2d37; --text:#eceef3; --muted:#9096a5;
  --accent:#ff6a3d; --accent-ink:#1a0903;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--body)}
body{padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font:700 20px var(--display);margin:0;letter-spacing:.01em}
h1 span{color:var(--accent)}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
header small{color:var(--muted)}
.app{display:grid;gap:14px;max-width:1000px;margin:0 auto}
@media(min-width:860px){.app{grid-template-columns:auto 1fr;align-items:start}}
.stagewrap{display:flex;flex-direction:column;gap:10px;align-items:center}
canvas#stage{height:min(62vh,calc((100vw - 32px)*16/9));aspect-ratio:9/16;width:auto;max-width:100%;background:#000;border-radius:14px;border:1px solid var(--line);touch-action:none;display:block}
@media(min-width:860px){canvas#stage{height:min(84vh,860px)}}
.recbar{display:flex;gap:10px;align-items:center;width:100%}
button,.btn,select,input[type=text]{font:500 14px var(--body);color:var(--text)}
button,.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:#464b5c}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.rec{flex:1;justify-content:center;padding:13px;font-size:15px}
.rec .dot{width:11px;height:11px;border-radius:50%;background:currentColor}
.rec.live{background:#fff;color:#c0200a;border-color:#fff}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);min-width:48px;text-align:right}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto}
.tabs button{border-radius:8px;border-color:transparent;background:transparent;color:var(--muted);flex:1;justify-content:center}
.tabs button[aria-selected=true]{background:#232631;color:var(--text);border-color:var(--line)}
.pane[hidden]{display:none}
label.field{display:grid;gap:4px;color:var(--muted);font-size:12px;margin-bottom:10px}
input[type=text]{background:#101218;border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row>input[type=text]{flex:1}
.row input[type=color]{width:38px;height:36px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button[aria-pressed=true]{background:#2a2d3a;border-color:var(--accent)}
.note{color:var(--muted);font-size:12px;margin:6px 0 0}
.status{min-height:18px;font-size:12px;color:var(--muted);margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#101218;border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 8px;max-width:100%}
.chip img{width:22px;height:22px;object-fit:cover;border-radius:4px}
.chip button{padding:0 6px;border:0;background:none;color:var(--muted)}
h2{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 8px}
h2:first-child{margin-top:0}
.result{display:grid;gap:8px;margin-top:12px}
.result video{width:100%;max-height:50vh;border-radius:10px;background:#000}
</style>
</head>
<body>
<header>
  <h1>After<span>frame</span></h1>
  <small>Prototype · template + face-cam in one take</small>
</header>

<main class="app">
  <section class="stagewrap">
    <canvas id="stage" width="720" height="1280" aria-label="Video canvas"></canvas>
    <div class="recbar">
      <button id="recBtn" class="primary rec"><span class="dot"></span><span id="recLabel">Record</span></button>
      <span class="timer" id="timer">0:00</span>
    </div>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="camera">Camera</button>
      <button role="tab" aria-selected="false" data-tab="template">Template</button>
      <button role="tab" aria-selected="false" data-tab="items">Items</button>
    </div>

    <div class="pane" id="pane-camera">
      <div class="row">
        <button id="camBtn" class="primary">Start camera</button>
        <button id="flipBtn" disabled>Flip</button>
        <label class="btn"><input type="checkbox" id="mirror" checked> Mirror</label>
      </div>
      <h2>Layout</h2>
      <div class="seg" id="layoutSeg">
        <button data-v="split" aria-pressed="true">Split (face on top)</button>
        <button data-v="bubble" aria-pressed="false">Bubble</button>
        <button data-v="cutout" aria-pressed="false">Cutout</button>
      </div>
      <div id="cutoutOpts" hidden>
        <h2>Background removal</h2>
        <div class="seg" id="keySeg">
          <button data-v="ai" aria-pressed="true">AI (no green screen)</button>
          <button data-v="chroma" aria-pressed="false">Green screen</button>
        </div>
        <label class="field" id="sensField" hidden>Green sensitivity
          <input type="range" id="sens" min="0" max="100" value="50"></label>
        <label class="field">Size
          <input type="range" id="pscale" min="25" max="80" value="48"></label>
        <label class="field">Position
          <input type="range" id="px" min="0" max="100" value="50"></label>
      </div>
      <p class="status" id="camStatus">Camera is off. Start it to see yourself on the canvas.</p>
    </div>

    <div class="pane" id="pane-template" hidden>
      <h2>Template</h2>
      <div class="wrap" id="presets"></div>
      <label class="field" style="margin-top:12px">Title on video
        <input type="text" id="title" maxlength="40"></label>
      <h2>Rows</h2>
      <div id="tierRows"></div>
      <button id="addTier">+ Add row</button>
    </div>

    <div class="pane" id="pane-items" hidden>
      <h2>Add items</h2>
      <div class="row">
        <input type="text" id="itemText" placeholder="Words or emoji, separate with commas" maxlength="120">
        <button id="addItem" class="primary">Add</button>
      </div>
      <label class="btn" style="width:100%;justify-content:center">Upload images
        <input type="file" id="imgs" accept="image/*" multiple hidden></label>
      <p class="note">Drag items on the canvas to rank them. Moves are captured while you record.</p>
      <div class="chips" id="chips"></div>
    </div>

    <div class="result" id="result" hidden>
      <h2>Your take</h2>
      <video id="preview" controls playsinline></video>
      <div class="wrap">
        <a class="btn primary" id="dl" download>Download</a>
        <button id="shareBtn" hidden>Share</button>
      </div>
    </div>
  </section>
</main>

<video id="cam" playsinline muted hidden></video>

<script>
(function(){
'use strict';
var W=720,H=1280;
var cv=document.getElementById('stage'),ctx=cv.getContext('2d');
var video=document.getElementById('cam');
var $=function(id){return document.getElementById(id)};

/* ---------- state ---------- */
var uid=0;
var PRESETS={
  tier:{label:'Tier list',title:'Methods tier list',tiers:[['S: Guaranteed','#ee7f8a'],['A: Elite','#f2b27d'],['B: Effective','#f4de8c'],['C: Hit or miss','#f6f58f'],['D: Weak','#bfef95']]},
  top5:{label:'Top 5',title:'My top 5',tiers:[['1','#ee7f8a'],['2','#f2b27d'],['3','#f4de8c'],['4','#bfef95'],['5','#8fd3f4']]},
  thisthat:{label:'This or that',title:'This or that',tiers:[['THIS','#7fb8ee'],['THAT','#ee7f8a']]},
  rate:{label:'Rate it',title:'Rate it',tiers:[['10/10','#ee7f8a'],['7/10','#f2b27d'],['5/10','#f4de8c'],['2/10','#bfef95']]}
};
var S={
  title:PRESETS.tier.title,
  tiers:PRESETS.tier.tiers.map(function(t){return{name:t[0],color:t[1]}}),
  items:[],
  cam:'split', key:'ai', mirror:true, facing:'user',
  sens:50, pscale:48, px:50,
  bubble:{x:W-150,y:H-380},
  count:0
};
function addText(t,tier){S.items.push({id:++uid,kind:'text',text:t,tier:tier==null?-1:tier})}
['🍕','🍔','🌮','🍣','🍜','🥗'].forEach(function(e,i){addText(e,i<3?i:-1)});
['🍟','🌭'].forEach(function(e){addText(e,-1)});

/* ---------- geometry ---------- */
function geo(){
  var camH=S.cam==='split'?420:0, headH=76, top=camH+headH, trayH=210, n=Math.max(1,S.tiers.length);
  var area=H-top-trayH;
  return {camH:camH,headH:headH,top:top,trayH:trayH,trayY:H-trayH,rowH:Math.min(120,Math.floor(area/n)),labelW:132};
}
function layoutItems(g){
  var rects=new Map(),availW=W-g.labelW-14;
  S.tiers.forEach(function(t,ti){
    var list=S.items.filter(function(i){return i.tier===ti}),n=list.length;
    if(!n)return;
    var s=Math.min(g.rowH-12,88),cap=Math.floor(availW/(s+6));
    if(n>cap)s=Math.max(30,Math.floor(availW/n)-6);
    list.forEach(function(it,k){rects.set(it.id,{x:g.labelW+10+k*(s+6),y:g.top+ti*g.rowH+(g.rowH-s)/2,w:s,h:s})});
  });
  var s2=76,cols=Math.floor((W-24)/(s2+8));
  S.items.filter(function(i){return i.tier===-1}).forEach(function(it,k){
    rects.set(it.id,{x:12+(k%cols)*(s2+8),y:g.trayY+44+Math.floor(k/cols)*(s2+8),w:s2,h:s2});
  });
  return rects;
}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawCover(src,sw,sh,x,y,w,h,mirror){
  var sr=sw/sh,dr=w/h,sx=0,sy=0,sW=sw,sH=sh;
  if(sr>dr){sW=sh*dr;sx=(sw-sW)/2}else{sH=sw/dr;sy=(sh-sH)/2}
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  if(mirror){ctx.translate(x+w,0);ctx.scale(-1,1);ctx.drawImage(src,sx,sy,sW,sH,0,y,w,h)}
  else ctx.drawImage(src,sx,sy,sW,sH,x,y,w,h);
  ctx.restore();
}
function drawItem(it,r,lift){
  ctx.save();
  if(lift){ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=20;ctx.shadowOffsetY=8}
  if(it.kind==='img'&&it.img&&it.img.complete&&it.img.naturalWidth){
    rr(r.x,r.y,r.w,r.h,12);ctx.fillStyle='#000';ctx.fill();ctx.shadowColor='transparent';
    ctx.clip();drawCover(it.img,it.img.naturalWidth,it.img.naturalHeight,r.x,r.y,r.w,r.h,false);
  }else{
    rr(r.x,r.y,r.w,r.h,12);ctx.fillStyle='#2b2f3a';ctx.fill();ctx.shadowColor='transparent';
    var t=it.text||'',isShort=t.length<=3,base=isShort?r.w*0.55:r.w*0.3;
    ctx.font='700 '+base+'px Inter,system-ui,sans-serif';
    var m=ctx.measureText(t).width,sz=m>r.w*0.88?base*r.w*0.88/m:base;
    ctx.font='700 '+sz+'px Inter,system-ui,sans-serif';
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(t,r.x+r.w/2,r.y+r.h/2+1);
  }
  ctx.restore();
}
function fitText(t,maxW,start,weight){
  var sz=start;ctx.font=weight+' '+sz+'px Inter,system-ui,sans-serif';
  var m=ctx.measureText(t).width;
  if(m>maxW){sz=Math.max(14,sz*maxW/m);ctx.font=weight+' '+sz+'px Inter,system-ui,sans-serif'}
}

/* ---------- camera + person cutout ---------- */
var stream=null,camOn=false,seg=null,segBusy=false;
var pc=document.createElement('canvas'),pctx=pc.getContext('2d',{willReadFrequently:true});
var personReady=false;

function setStatus(m){$('camStatus').textContent=m}
async function startCam(){
  stopCam();
  var vc={facingMode:S.facing,width:{ideal:1280},height:{ideal:720}};
  try{stream=await navigator.mediaDevices.getUserMedia({video:vc,audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){
    try{stream=await navigator.mediaDevices.getUserMedia({video:vc});setStatus('Camera on. Microphone unavailable, so recordings will be silent.')}
    catch(e2){setStatus('Could not open the camera. Allow camera access in your browser, and open this page over https or from a local file.');return}
  }
  video.srcObject=stream;await video.play();
  camOn=true;$('camBtn').textContent='Stop camera';$('flipBtn').disabled=false;
  if(stream.getAudioTracks().length)setStatus('Camera and mic are on.');
}
function stopCam(){
  if(stream){stream.getTracks().forEach(function(t){t.stop()})}
  stream=null;camOn=false;personReady=false;video.srcObject=null;
  $('camBtn').textContent='Start camera';$('flipBtn').disabled=true;
}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.crossOrigin='anonymous';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
var SEG_BASE='https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/';
async function ensureSeg(){
  if(seg)return true;
  setStatus('Loading AI cutout…');
  try{
    if(!window.SelfieSegmentation)await loadScript(SEG_BASE+'selfie_segmentation.js');
    seg=new window.SelfieSegmentation({locateFile:function(f){return SEG_BASE+f}});
    seg.setOptions({modelSelection:1});
    seg.onResults(function(r){
      var w=Math.round(r.image.width/2),h=Math.round(r.image.height/2);
      if(pc.width!==w||pc.height!==h){pc.width=w;pc.height=h}
      pctx.save();pctx.clearRect(0,0,w,h);
      pctx.drawImage(r.segmentationMask,0,0,w,h);
      pctx.globalCompositeOperation='source-in';
      pctx.drawImage(r.image,0,0,w,h);
      pctx.restore();personReady=true;
    });
    setStatus('AI cutout ready.');return true;
  }catch(e){
    seg=null;S.key='chroma';syncUI();
    setStatus('AI cutout could not load (needs internet). Switched to green screen mode.');return false;
  }
}
async function segTick(){
  if(camOn&&S.cam==='cutout'&&S.key==='ai'&&seg&&video.readyState>=2&&!segBusy){
    segBusy=true;try{await seg.send({image:video})}catch(e){}segBusy=false;
  }
  requestAnimationFrame(segTick);
}
function chromaFrame(){
  if(!camOn||video.readyState<2||!video.videoWidth)return;
  var cw=360,ch=Math.round(cw*video.videoHeight/video.videoWidth);
  if(pc.width!==cw||pc.height!==ch){pc.width=cw;pc.height=ch}
  pctx.drawImage(video,0,0,cw,ch);
  var img=pctx.getImageData(0,0,cw,ch),d=img.data,T=60-S.sens*0.4;
  for(var i=0;i<d.length;i+=4){
    var r=d[i],g=d[i+1],b=d[i+2],m=r>b?r:b,gd=g-m;
    if(gd>T){
      var a=gd>T+30?0:255*(1-(gd-T)/30);
      d[i+3]=a;d[i+1]=m;
    }else if(gd>0){d[i+1]=m+gd*0.5}
  }
  pctx.putImageData(img,0,0);personReady=true;
}
function drawPerson(){
  if(!camOn||!personReady||!pc.width)return;
  var h=H*S.pscale/100,w=pc.width/pc.height*h,x=(W-w)*S.px/100,y=H-h;
  ctx.save();
  if(S.mirror){ctx.translate(x+w/2,0);ctx.scale(-1,1);ctx.translate(-(x+w/2),0)}
  ctx.drawImage(pc,x,y,w,h);ctx.restore();
}

/* ---------- main render ---------- */
var drag=null,rects=new Map(),G=geo();
function render(){
  G=geo();rects=layoutItems(G);
  ctx.fillStyle='#121316';ctx.fillRect(0,0,W,H);

  if(S.cam==='split'){
    if(camOn&&video.videoWidth)drawCover(video,video.videoWidth,video.videoHeight,0,0,W,G.camH,S.mirror);
    else{ctx.fillStyle='#1b1d24';ctx.fillRect(0,0,W,G.camH);ctx.fillStyle='#6b7080';ctx.font='500 26px Inter,system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Camera off',W/2,G.camH/2)}
  }
  /* title band */
  var ty=G.camH;
  ctx.fillStyle='#0b0c0f';ctx.fillRect(0,ty,W,G.headH);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  fitText(S.title,W-60,40,'800');ctx.fillText(S.title,W/2,ty+G.headH/2+2);

  /* rows */
  S.tiers.forEach(function(t,i){
    var y=G.top+i*G.rowH;
    ctx.fillStyle=t.color;ctx.fillRect(0,y,G.labelW,G.rowH);
    ctx.fillStyle='#161719';ctx.fillRect(G.labelW,y,W-G.labelW,G.rowH);
    ctx.fillStyle='#000';ctx.fillRect(0,y+G.rowH-2,W,2);
    ctx.fillStyle='#222';ctx.textAlign='center';ctx.textBaseline='middle';
    fitText(t.name,G.labelW-20,30,'600');ctx.fillText(t.name,G.labelW/2,y+G.rowH/2);
  });
  /* tray */
  ctx.fillStyle='#0d0e11';ctx.fillRect(0,G.trayY,W,G.trayH);
  ctx.fillStyle='#6b7080';ctx.font='600 18px Inter,system-ui,sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('ITEMS · drag into a row',16,G.trayY+22);

  S.items.forEach(function(it){if(drag&&drag.kind==='item'&&drag.it===it)return;var r=rects.get(it.id);if(r)drawItem(it,r,false)});

  if(S.cam==='cutout'){if(S.key==='chroma')chromaFrame();drawPerson()}

  if(S.cam==='bubble'&&camOn&&video.videoWidth){
    var b=S.bubble,R=120;
    ctx.save();ctx.beginPath();ctx.arc(b.x,b.y,R,0,Math.PI*2);ctx.clip();
    drawCover(video,video.videoWidth,video.videoHeight,b.x-R,b.y-R,R*2,R*2,S.mirror);ctx.restore();
    ctx.lineWidth=6;ctx.strokeStyle='#ff6a3d';ctx.beginPath();ctx.arc(b.x,b.y,R,0,Math.PI*2);ctx.stroke();
  }
  if(drag&&drag.kind==='item'){
    var s=84;drawItem(drag.it,{x:drag.x-s/2,y:drag.y-s/2,w:s,h:s},true);
  }
  if(S.count>0){
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='800 260px Space Grotesk,Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(S.count),W/2,H/2);
  }
  requestAnimationFrame(render);
}

/* ---------- pointer interaction ---------- */
function pt(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',function(e){
  var p=pt(e);
  for(var i=S.items.length-1;i>=0;i--){
    var it=S.items[i],r=rects.get(it.id);
    if(r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){
      drag={kind:'item',it:it,x:p.x,y:p.y};cv.setPointerCapture(e.pointerId);return;
    }
  }
  if(S.cam==='bubble'&&camOn){
    var dx=p.x-S.bubble.x,dy=p.y-S.bubble.y;
    if(dx*dx+dy*dy<120*120){drag={kind:'bubble',ox:dx,oy:dy};cv.setPointerCapture(e.pointerId)}
  }
});
cv.addEventListener('pointermove',function(e){
  if(!drag)return;var p=pt(e);
  if(drag.kind==='item'){drag.x=p.x;drag.y=p.y}
  else{S.bubble.x=Math.max(120,Math.min(W-120,p.x-drag.ox));S.bubble.y=Math.max(120,Math.min(H-120,p.y-drag.oy))}
});
function endDrag(e){
  if(!drag)return;
  if(drag.kind==='item')dropItem(drag.it,drag.x,drag.y);
  drag=null;renderChips();
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',function(){drag=null});
function dropItem(it,x,y){
  var target=null;
  if(y>=G.trayY)target=-1;
  else if(y>=G.top&&y<G.top+G.rowH*S.tiers.length)target=Math.floor((y-G.top)/G.rowH);
  if(target===null)return;
  var before=null,group=S.items.filter(function(i){return i!==it&&i.tier===target});
  for(var k=0;k<group.length;k++){
    var r=rects.get(group[k].id);
    if(r&&y<r.y+r.h&&x<r.x+r.w/2){before=group[k];break}
  }
  S.items=S.items.filter(function(i){return i!==it});it.tier=target;
  if(before)S.items.splice(S.items.indexOf(before),0,it);else S.items.push(it);
}

/* ---------- controls ---------- */
function syncUI(){
  [].forEach.call($('layoutSeg').children,function(b){b.setAttribute('aria-pressed',b.dataset.v===S.cam)});
  [].forEach.call($('keySeg').children,function(b){b.setAttribute('aria-pressed',b.dataset.v===S.key)});
  $('cutoutOpts').hidden=S.cam!=='cutout';
  $('sensField').hidden=S.key!=='chroma';
}
$('layoutSeg').addEventListener('click',async function(e){
  var b=e.target.closest('button');if(!b)return;
  S.cam=b.dataset.v;personReady=false;syncUI();
  if(S.cam==='cutout'&&S.key==='ai')await ensureSeg();
});
$('keySeg').addEventListener('click',async function(e){
  var b=e.target.closest('button');if(!b)return;
  S.key=b.dataset.v;personReady=false;syncUI();
  if(S.key==='ai')await ensureSeg();
});
$('camBtn').addEventListener('click',async function(){
  if(camOn){stopCam();setStatus('Camera is off.');return}
  await startCam();
  if(camOn&&S.cam==='cutout'&&S.key==='ai')ensureSeg();
});
$('flipBtn').addEventListener('click',async function(){
  S.facing=S.facing==='user'?'environment':'user';
  S.mirror=S.facing==='user';$('mirror').checked=S.mirror;await startCam();
});
$('mirror').addEventListener('change',function(e){S.mirror=e.target.checked});
$('sens').addEventListener('input',function(e){S.sens=+e.target.value});
$('pscale').addEventListener('input',function(e){S.pscale=+e.target.value});
$('px').addEventListener('input',function(e){S.px=+e.target.value});

document.querySelector('.tabs').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  [].forEach.call(document.querySelectorAll('.tabs button'),function(x){x.setAttribute('aria-selected',x===b)});
  ['camera','template','items'].forEach(function(n){$('pane-'+n).hidden=n!==b.dataset.tab});
});

/* template tab */
function renderPresets(){
  var box=$('presets');box.textContent='';
  Object.keys(PRESETS).forEach(function(k){
    var b=document.createElement('button');b.textContent=PRESETS[k].label;
    b.addEventListener('click',function(){
      var p=PRESETS[k];S.title=p.title;
      S.tiers=p.tiers.map(function(t){return{name:t[0],color:t[1]}});
      S.items.forEach(function(i){if(i.tier>=S.tiers.length)i.tier=-1});
      $('title').value=S.title;renderTierRows();renderChips();
    });
    box.appendChild(b);
  });
}
function renderTierRows(){
  var box=$('tierRows');box.textContent='';
  S.tiers.forEach(function(t,i){
    var row=document.createElement('div');row.className='row';
    var c=document.createElement('input');c.type='color';c.value=t.color;c.setAttribute('aria-label','Row color');
    c.addEventListener('input',function(){t.color=c.value});
    var n=document.createElement('input');n.type='text';n.value=t.name;n.maxLength=24;n.setAttribute('aria-label','Row name');
    n.addEventListener('input',function(){t.name=n.value});
    var x=document.createElement('button');x.textContent='✕';x.setAttribute('aria-label','Remove row');
    x.addEventListener('click',function(){
      if(S.tiers.length<=1)return;
      S.items.forEach(function(it){if(it.tier===i)it.tier=-1;else if(it.tier>i)it.tier--});
      S.tiers.splice(i,1);renderTierRows();renderChips();
    });
    row.appendChild(c);row.appendChild(n);row.appendChild(x);box.appendChild(row);
  });
}
$('addTier').addEventListener('click',function(){
  if(S.tiers.length>=8)return;
  S.tiers.push({name:'New row',color:'#8fd3f4'});renderTierRows();
});
$('title').addEventListener('input',function(e){S.title=e.target.value});

/* items tab */
function renderChips(){
  var box=$('chips');box.textContent='';
  S.items.forEach(function(it){
    var c=document.createElement('span');c.className='chip';
    if(it.kind==='img'&&it.img){var im=document.createElement('img');im.src=it.img.src;im.alt='';c.appendChild(im)}
    else{var s=document.createElement('span');s.textContent=it.text;c.appendChild(s)}
    var x=document.createElement('button');x.textContent='✕';x.setAttribute('aria-label','Remove item');
    x.addEventListener('click',function(){S.items=S.items.filter(function(i){return i!==it});renderChips()});
    c.appendChild(x);box.appendChild(c);
  });
}
function addFromInput(){
  var v=$('itemText').value;
  v.split(',').map(function(s){return s.trim()}).filter(Boolean).forEach(function(t){addText(t,-1)});
  $('itemText').value='';renderChips();
}
$('addItem').addEventListener('click',addFromInput);
$('itemText').addEventListener('keydown',function(e){if(e.key==='Enter')addFromInput()});
$('imgs').addEventListener('change',function(e){
  [].forEach.call(e.target.files,function(f){
    var img=new Image();img.onload=function(){renderChips()};
    img.src=URL.createObjectURL(f);
    S.items.push({id:++uid,kind:'img',img:img,tier:-1});
  });
  e.target.value='';renderChips();
});

/* ---------- recording ---------- */
var rec=null,chunks=[],recStart=0,tick=null,lastUrl=null,lastFile=null;
function pickMime(){
  var c=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(var i=0;i<c.length;i++){if(window.MediaRecorder&&MediaRecorder.isTypeSupported(c[i]))return c[i]}
  return '';
}
function fmt(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function setRecUI(on){
  $('recBtn').classList.toggle('live',on);
  $('recLabel').textContent=on?'Stop':'Record';
}
async function startRecording(){
  if(!window.MediaRecorder){setStatus('This browser cannot record video. Try Chrome, Edge or Safari 14.1+.');return}
  $('result').hidden=true;
  for(var n=3;n>0;n--){S.count=n;await new Promise(function(r){setTimeout(r,800)})}
  S.count=0;
  var out=cv.captureStream(30);
  if(stream)stream.getAudioTracks().forEach(function(t){out.addTrack(t)});
  var mime=pickMime(),opts={videoBitsPerSecond:6000000};if(mime)opts.mimeType=mime;
  rec=new MediaRecorder(out,opts);chunks=[];
  rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=finishRecording;
  rec.start(500);recStart=Date.now();setRecUI(true);
  tick=setInterval(function(){$('timer').textContent=fmt(Date.now()-recStart)},250);
}
function stopRecording(){if(rec&&rec.state!=='inactive')rec.stop();clearInterval(tick);setRecUI(false)}
function finishRecording(){
  var type=(rec&&rec.mimeType)||'video/webm',ext=type.indexOf('mp4')>-1?'mp4':'webm';
  var blob=new Blob(chunks,{type:type.split(';')[0]});
  if(lastUrl)URL.revokeObjectURL(lastUrl);
  lastUrl=URL.createObjectURL(blob);
  lastFile=new File([blob],'afterframe-'+Date.now()+'.'+ext,{type:blob.type});
  $('preview').src=lastUrl;$('dl').href=lastUrl;$('dl').download=lastFile.name;
  $('shareBtn').hidden=!(navigator.canShare&&navigator.canShare({files:[lastFile]}));
  $('result').hidden=false;$('result').scrollIntoView({behavior:'smooth',block:'nearest'});
}
$('recBtn').addEventListener('click',function(){
  if(S.count>0)return;
  if(rec&&rec.state==='recording')stopRecording();else startRecording();
});
$('shareBtn').addEventListener('click',function(){
  if(lastFile)navigator.share({files:[lastFile],title:'Afterframe'}).catch(function(){});
});

/* ---------- boot ---------- */
$('title').value=S.title;
renderPresets();renderTierRows();renderChips();syncUI();
requestAnimationFrame(render);requestAnimationFrame(segTick);
})();
</script>
</body>
</html>
